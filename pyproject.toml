[project]
name = "heatcheck-ai"
version = "0.0.1"
description = "Preparation scaffold for an adversarial NBA research system"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1", "pyyaml>=6,<7"]
backend = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.30,<1", "httpx>=0.28,<0.29"]
research = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]
browser = ["playwright>=1.50,<2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = ["browser: requires an installed browser", "research: requires research dependencies"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["spec/reference", "docs/history", "docs/team", "reports", "incoming"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
